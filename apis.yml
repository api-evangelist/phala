  description: >-
    OpenAI-compatible confidential inference API (chat completions, responses, Anthropic-format messages,
    completions, embeddings, models) served from GPU TEEs, plus attestation report, signed receipt and
    attested-session endpoints. Documented on docs.phala.com; no machine-readable contract is published.
